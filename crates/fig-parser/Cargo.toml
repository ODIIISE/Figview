[package]
name = "fig-parser"
version = "0.1.0"
edition = "2021"
description = "Parser for Figma .fig binary files"

[dependencies]
kiwi-schema = "0.2.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
zstd = "0.13"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"