name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI (Rust)
        run: cargo install tauri-cli --version "2" --locked

      - name: Build Rust binary
        run: cargo build --release -p fig-viewer

      - name: Bundle (NSIS)
        run: cargo tauri build --bundles nsis -v

      - name: List bundle output
        run: dir /s /b src-tauri\target\release\bundle 2>nul & dir /s /b src-tauri\target\release\*.exe 2>nul & dir /s /b src-tauri\target\release\*.msi 2>nul
        continue-on-error: true

      - name: List all release files
        run: dir /s /b src-tauri\target\release
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIG-Viewer-Windows
          path: src-tauri/target/release/fig-viewer.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/fig-viewer.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi