name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Windows installer
        run: cargo tauri build --bundles nsis

      - name: Show output tree
        run: dir /s /b src-tauri\target\release\bundle 2>nul || echo "No bundle dir"
        continue-on-error: true

      - name: Show target dir
        run: dir /s /b src-tauri\target\release\*.exe 2>nul || echo "No exe found"
        continue-on-error: true

      - name: Upload artifact (any exe found)
        uses: actions/upload-artifact@v4
        with:
          name: FIG-Viewer-Windows
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/release/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi