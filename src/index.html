<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIG Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1e1e1e;--bg2:#2c2c2c;--bg3:#383838;--bo:#3e3e3e;--tx:#e0e0e0;--tx2:#999;--ac:#18a0fb;--sel:#2a4365}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:12px system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100vh}
#tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--bo);padding:0 8px;min-height:32px;align-items:flex-end;gap:2px}
.tab{display:flex;align-items:center;padding:4px 10px;border-radius:6px 6px 0 0;background:var(--bg3);border:1px solid var(--bo);border-bottom:none;cursor:pointer;font-size:11px;gap:6px;max-width:180px}
.tab.active{background:var(--bg)}
.tab .close{opacity:0.4;cursor:pointer;font-size:14px}
.tab .close:hover{opacity:1;color:#e06c75}
.tab .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--bo);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:6px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--tx2);border-bottom:1px solid var(--bo);flex-shrink:0}
.scroll{flex:1;overflow-y:auto;padding:2px 0}
.page,.layer{display:flex;align-items:center;padding:3px 10px;cursor:pointer;gap:5px;font-size:11px}
.page:hover,.layer:hover{background:var(--bg3)}
.page.active{background:var(--sel)}
.layer.selected{background:var(--sel)}
.layer .icon{width:14px;text-align:center;flex-shrink:0;font-size:10px}
.layer .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#canvas-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#zoom-bar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:var(--bg2);border-bottom:1px solid var(--bo);flex-shrink:0}
#zoom-bar button{background:var(--bg3);border:1px solid var(--bo);color:var(--tx);padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px;margin:0 2px}
#zoom-bar button:hover{background:var(--ac)}
#zoom-lvl{min-width:40px;text-align:center;font-size:11px}
#canvas-wrap{flex:1;overflow:hidden;position:relative}
canvas{position:absolute;top:0;left:0}
#props{width:200px;background:var(--bg2);border-left:1px solid var(--bo);padding:10px;overflow-y:auto;font-size:11px}
.pg{margin-bottom:8px}
.pl{color:var(--tx2);font-size:10px;margin-bottom:1px}
.pv{color:var(--tx)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--bo);margin-right:4px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="tab-bar"><div class="tab-placeholder empty" style="padding:8px;justify-content:flex-start;flex:1">Choose Open, press Ctrl+O, or drop a .fig file here</div></div>
  <div id="main">
    <div id="sidebar"><div class="panel-header">PAGES</div><div class="scroll" id="pages"></div><div class="panel-header" style="border-top:1px solid var(--bo)">LAYERS</div><div class="scroll" id="layers"></div></div>
    <div id="canvas-area">
      <div id="zoom-bar">
        <div><button id="open-file" type="button">Open</button><button id="zout" type="button">−</button><span id="zoom-lvl">100%</span><button id="zin" type="button">+</button></div>
        <div><button id="fit" type="button">Fit</button><button id="z100" type="button">100%</button></div>
      </div>
      <div id="canvas-wrap"><canvas id="c"></canvas></div>
    </div>
    <div id="props"></div>
  </div>
</div>

<script type="module">
// ── State ──
let doc = null;
let activePage = null;
let selection = null;
let zoom = 1;
let ox = 0, oy = 0;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── File open ──
const tauri = window.__TAURI__;
const isTauri = !!tauri?.core?.invoke;

async function openDialog() {
  if (tauri?.dialog?.open) {
    try {
      const path = await tauri.dialog.open({
        multiple: false,
        directory: false,
        filters: [{ name: 'Figma files', extensions: ['fig'] }]
      });
      if (typeof path === 'string' && path.length > 0) await loadFromPath(path);
      return;
    } catch (e) {
      console.error('Tauri dialog failed, using file input fallback:', e);
    }
  }

  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.fig,application/zip';
  inp.onchange = async () => { if (inp.files?.[0]) await loadFromFile(inp.files[0]); };
  inp.click();
}

async function loadFromPath(path) {
  showLoading('Opening file...');
  try {
    doc = await tauri.core.invoke('open_file', { path });
    onDocLoaded(path.split(/[/\\]/).pop() || 'Untitled.fig');
  } catch (e) {
    showError('Failed to open: ' + errorText(e));
    console.error('open_file failed:', e);
  }
}

async function loadFromFile(file) {
  const name = file.name || 'Untitled.fig';
  showLoading('Parsing file...');
  try {
    if (isTauri) {
      // Send raw bytes to Rust command — converts ArrayBuffer → number[] for IPC
      const buf = await file.arrayBuffer();
      const bytes = Array.from(new Uint8Array(buf));
      doc = await tauri.core.invoke('open_file_bytes', { data: bytes, name });
    } else {
      // Browser-only: show message since parser runs in Rust
      alert('Browser-only mode — no Rust parser available.\n\nUse the Tauri app to open .fig files.');
      return;
    }
    onDocLoaded(name);
  } catch (e) {
    showError('Failed to parse: ' + e);
    console.error(e);
  }
}

function onDocLoaded(name) {
  if (!doc || !Array.isArray(doc.pages) || doc.pages.length === 0) {
    showError('No pages found in document');
    return;
  }
  activePage = doc.pages[0];
  selection = null;
  zoom = 1;
  ox = oy = 0;
  renderAll();
  document.getElementById('tab-bar').innerHTML = `<div class="tab active"><span class="name">${esc(name)}</span><span class="close" data-close-tab>&times;</span></div>`;
}

function showLoading(msg) {
  document.getElementById('tab-bar').innerHTML = `<div class="tab active" style="color:var(--ac)">⏳ ${esc(msg)}</div>`;
}

function showError(msg) {
  document.getElementById('tab-bar').innerHTML = `<div class="tab active" style="color:#e06c75">❌ ${esc(msg)} <span class="close" data-close-tab>&times;</span></div>`;
}

function closeTab() {
  doc = null;
  activePage = null;
  selection = null;
  renderAll();
}

function errorText(error) {
  return error instanceof Error ? error.message : String(error);
}

// ── Rendering ──
function renderAll() {
  if (!doc) {
    document.getElementById('pages').innerHTML = '';
    document.getElementById('layers').innerHTML = '';
    document.getElementById('props').innerHTML = '';
    renderCanvas();
    document.getElementById('tab-bar').innerHTML = '<div class="tab-placeholder empty" style="padding:8px;justify-content:flex-start;flex:1">Choose Open, press Ctrl+O, or drop a .fig file here</div>';
    return;
  }
  renderPages();
  renderLayers();
  renderCanvas();
  renderProps();
}

function renderPages() {
  const el = document.getElementById('pages');
  el.innerHTML = doc.pages.map(p => `<div class="page${activePage && p.id.session_id === activePage.id.session_id && p.id.local_id === activePage.id.local_id ? ' active' : ''}" data-page="${p.id.session_id}:${p.id.local_id}">📄 ${esc(p.name)}</div>`).join('');
  el.querySelectorAll('.page').forEach(e => e.onclick = () => { activePage = doc.pages.find(p => `${p.id.session_id}:${p.id.local_id}` === e.dataset.page); renderAll(); });
}

function renderLayers() {
  const el = document.getElementById('layers');
  if (!activePage) { el.innerHTML = ''; return; }
  const key = `${activePage.id.session_id}:${activePage.id.local_id}`;
  const ids = doc.children_map[key] || [];
  const nodes = doc.nodes;
  el.innerHTML = ids.map(id => layerItem(id, 0, nodes)).join('');
  el.querySelectorAll('.layer').forEach(e => e.onclick = () => {
    selection = nodes.find(n => nid(n) === e.dataset.id);
    renderAll();
  });
}

function layerItem(id, depth, nodes) {
  const n = nodes.find(x => nid(x) === id);
  if (!n || n.phase === 'Removed') return '';
  const kids = doc.children_map[id] || [];
  const sel = selection && nid(selection) === id;
  const icons = {Frame:'⊞',Group:'⊟',Text:'T',Rectangle:'▭',Ellipse:'○',Line:'╱',Vector:'✦',Component:'◇',Instance:'◈',Section:'§',BooleanGroup:'⊕',Canvas:'📄'};
  return `<div class="layer${sel?' selected':''}" data-id="${id}" style="padding-left:${10+depth*14}px">
    <span class="icon">${icons[n.node_type]||'◆'}</span><span class="name">${esc(n.name)}</span>
  </div>${kids.map(kid => layerItem(kid, depth+1, nodes)).join('')}`;
}

function renderCanvas() {
  const w = document.getElementById('canvas-wrap').clientWidth;
  const h = document.getElementById('canvas-wrap').clientHeight;
  canvas.width = w; canvas.height = h;
  ctx.clearRect(0, 0, w, h);
  if (!doc || !activePage) return;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(zoom, zoom);
  ctx.fillStyle = '#e5e5e5'; ctx.fillRect(-50000, -50000, 100000, 100000);
  const key = `${activePage.id.session_id}:${activePage.id.local_id}`;
  const ids = doc.children_map[key] || [];
  for (const id of ids) drawNode(id);
  ctx.restore();
  document.getElementById('zoom-lvl').textContent = Math.round(zoom * 100) + '%';
}

function drawNode(id) {
  const n = doc.nodes.find(x => nid(x) === id);
  if (!n || !n.visible || n.phase === 'Removed') return;
  ctx.save();
  if (n.transform) ctx.transform(n.transform.m00, n.transform.m10, n.transform.m01, n.transform.m11, n.transform.m02, n.transform.m12);
  const w = n.size?.x || 0, h = n.size?.y || 0;
  if (n.opacity < 1) ctx.globalAlpha *= n.opacity;

  // Effects — must be set BEFORE drawing for Canvas 2D shadow to apply
  for (const e of n.effects || []) {
    if (e.effect_type === 'DropShadow' && e.visible) {
      ctx.shadowColor = e.color ? rgba(e.color) : 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = e.radius;
      ctx.shadowOffsetX = e.offset.x;
      ctx.shadowOffsetY = e.offset.y;
    }
  }

  // Clipping (Frames + Components + Instances clip children by default)
  const isContainer = n.node_type === 'Frame' || n.node_type === 'Component' || n.node_type === 'Instance';
  if (isContainer) { ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.clip(); }

  // Fills
  for (const p of n.fill_paints || []) {
    if (!p.visible) continue;
    if (p.paint_type === 'Solid' && p.color) {
      ctx.fillStyle = rgba(p.color, p.opacity);
      ctx.fillRect(0, 0, w, h);
    } else if (p.stops && p.stops.length >= 2) {
      // Gradients: use transform to derive handles, or fall back to node edges
      const t = p.transform;
      const x0 = t ? t.m02 : 0;
      const y0 = t ? t.m12 : 0;
      const x1 = t ? t.m00 * w + t.m02 : w;
      const y1 = t ? t.m11 * h + t.m12 : h;
      if (p.paint_type === 'GradientRadial') {
        const g = ctx.createRadialGradient(x0, y0, 0, x0, y0, Math.max(w, h) * (t ? Math.abs(t.m00) : 1));
        for (const s of p.stops) g.addColorStop(s.position, rgba(s.color));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      } else {
        const g = ctx.createLinearGradient(x0, y0, x1, y1);
        for (const s of p.stops) g.addColorStop(s.position, rgba(s.color));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }
    }
  }

  // Text
  if (n.text_data && n.node_type === 'Text') {
    const td = n.text_data;
    ctx.font = `${td.font_weight||400} ${td.font_size||16}px ${td.font_family||'system-ui,sans-serif'}`;
    const textColor = td.fills?.[0]?.color || n.fill_paints?.[0]?.color;
    if (textColor) ctx.fillStyle = rgba(textColor);
    ctx.fillText(td.characters||'', 0, (td.font_size||16)*0.8);
  }

  // Strokes
  if (n.stroke_weight > 0 && n.stroke_paints?.length) {
    ctx.strokeStyle = n.stroke_paints[0].color ? rgba(n.stroke_paints[0].color) : '#000';
    ctx.lineWidth = n.stroke_weight;
    ctx.beginPath(); ctx.rect(0, 0, w, h); ctx.stroke();
  }

  // Selection
  if (selection && nid(selection) === id) {
    ctx.strokeStyle = '#18a0fb';
    ctx.lineWidth = 2 / (ctx.getTransform().a || 1);
    ctx.beginPath(); ctx.rect(-1, -1, w+2, h+2); ctx.stroke();
  }

  // Children
  const kids = doc.children_map[id] || [];
  for (const cid of kids) drawNode(cid);
  ctx.restore();
}

function renderProps() {
  const el = document.getElementById('props');
  if (!selection) { el.innerHTML = ''; return; }
  const n = selection;
  let h = `<div class="pg"><div class="pl">Name</div><div class="pv">${esc(n.name)}</div></div>`;
  h += `<div class="pg"><div class="pl">Type</div><div class="pv">${n.node_type}</div></div>`;
  if (n.size) h += `<div class="pg"><div class="pl">Size</div><div class="pv">W:${f(n.size.x)} H:${f(n.size.y)}</div></div>`;
  if (n.transform) h += `<div class="pg"><div class="pl">Position</div><div class="pv">X:${f(n.transform.m02)} Y:${f(n.transform.m12)}</div></div>`;
  h += `<div class="pg"><div class="pl">Opacity</div><div class="pv">${(n.opacity*100)|0}%</div></div>`;
  for (const p of n.fill_paints||[]) {
    if (p.paint_type === 'Solid' && p.color) h += `<div class="pg"><div class="pl">Fill</div><div class="pv"><span class="swatch" style="background:${rgba(p.color)}"></span>${rgba(p.color)}</div></div>`;
  }
  if (n.stroke_weight > 0) h += `<div class="pg"><div class="pl">Stroke</div><div class="pv">${f(n.stroke_weight)}px</div></div>`;
  if (n.corner_radius) h += `<div class="pg"><div class="pl">Corner</div><div class="pv">${f(n.corner_radius)}</div></div>`;
  if (n.text_data) {
    const td = n.text_data;
    h += `<div class="pg"><div class="pl">Font</div><div class="pv">${td.font_family||'—'} ${td.font_weight} ${f(td.font_size)}px</div></div>`;
  }
  el.innerHTML = h;
}

// ── Utilities ──
function nid(n) { return n.guid ? `${n.guid.session_id}:${n.guid.local_id}` : ''; }
function rgba(c, a) { return `rgba(${(c.r*255)|0},${(c.g*255)|0},${(c.b*255)|0},${a??c.a})`; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function f(v) { return Math.round(v*100)/100; }

// ── Zoom & keyboard ──
document.getElementById('open-file').onclick = openDialog;
document.getElementById('tab-bar').addEventListener('click', e => {
  if (e.target.closest('[data-close-tab]')) closeTab();
});
document.getElementById('canvas-wrap').addEventListener('wheel', e => { e.preventDefault(); const f = e.deltaY < 0 ? 1.12 : 0.9; zoom = Math.max(0.1, Math.min(zoom * f, 8)); renderCanvas(); });
document.getElementById('zin').onclick = () => { zoom = Math.min(zoom*1.25, 8); renderCanvas(); };
document.getElementById('zout').onclick = () => { zoom = Math.max(zoom*0.8, 0.25); renderCanvas(); };
document.getElementById('fit').onclick = () => { zoom = 0.5; ox = oy = 0; renderCanvas(); };
document.getElementById('z100').onclick = () => { zoom = 1; ox = oy = 0; renderCanvas(); };
document.addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key === 'o') { e.preventDefault(); openDialog(); }
  if (e.key === '+'||e.key === '=') { zoom = Math.min(zoom*1.25, 8); renderCanvas(); }
  if (e.key === '-') { zoom = Math.max(zoom*0.8, 0.25); renderCanvas(); }
  if (e.key === '1' && !e.ctrlKey) { zoom = 1; renderCanvas(); }
  if (e.key === '0' && !e.ctrlKey) { zoom = 1; ox = oy = 0; renderCanvas(); }
  if (e.key === 'Escape') { selection = null; renderAll(); }
});

// ── Resize ──
new ResizeObserver(() => renderCanvas()).observe(document.getElementById('canvas-wrap'));

// ── Drag & drop ──
if (tauri?.event?.listen) {
  // Tauri owns native file drops and supplies absolute paths on Windows.
  tauri.event.listen('tauri://drag-drop', event => {
    const paths = event.payload?.paths;
    const path = Array.isArray(paths) ? paths.find(item => typeof item === 'string' && item.toLowerCase().endsWith('.fig')) : null;
    if (path) void loadFromPath(path);
    else if (Array.isArray(paths) && paths.length) showError('Drop a .fig file here');
  }).catch(error => console.error('Tauri drag-drop listener failed:', error));
} else {
  // Browser fallback when the HTML file is opened outside Tauri.
  document.body.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  document.body.addEventListener('drop', async e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file && file.name.toLowerCase().endsWith('.fig')) await loadFromFile(file);
    else showError('Drop a .fig file here');
  });
}

if (isTauri) {
  tauri.core.invoke('take_startup_path')
    .then(path => { if (typeof path === 'string' && path.length > 0) return loadFromPath(path); })
    .catch(error => console.error('Startup file check failed:', error));
}
</script>
</body>
</html>
